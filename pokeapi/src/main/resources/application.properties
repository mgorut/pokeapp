# ---- Application ----
spring.application.name=pokeapi

# ---- Datasource (Postgres by default; test profile overrides with H2) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pokemanager}
spring.datasource.username=${DB_USERNAME:pokemanager}
spring.datasource.password=${DB_PASSWORD:pokemanager}
# none: Flyway owns the schema exclusively. We avoid Hibernate "validate" because
# it cannot reconcile Postgres jsonb/text columns against a portable String mapping
# (the tags column is intentionally mapped without a vendor-specific type).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---- Flyway: schema + seed migrations live in db/migration ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-pg

# ---- Upstream PokeAPI ----
pokeapi.base-url=${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
pokeapi.connect-timeout=PT5S
pokeapi.read-timeout=PT10S

# ---- Security / JWT ----
# DEMO-ONLY secret (>=32 chars). Override via env var in any real deployment.
security.jwt.secret=${JWT_SECRET:change-me-pokemanager-dev-secret-please-override}
security.jwt.ttl=PT8H

# ---- Actuator (Docker healthcheck uses /actuator/health) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
