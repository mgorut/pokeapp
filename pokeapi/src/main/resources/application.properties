spring.application.name=pokeapi
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/migration-pg
pokeapi.base-url=${POKEAPI_BASE_URL}
pokeapi.connect-timeout=PT5S
pokeapi.read-timeout=PT10S
security.jwt.secret=${JWT_SECRET}
security.jwt.ttl=PT8H
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
