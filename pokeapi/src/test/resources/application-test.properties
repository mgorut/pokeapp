# Integration-test profile: H2 in PostgreSQL compatibility mode so the Flyway
# migrations (UUID/JSONB/TIMESTAMP) run unmodified against an embedded DB.
spring.datasource.url=jdbc:h2:mem:pokemanager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Schema is owned by Flyway exactly like production (jsonb column included).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=none

# Deterministic, fast hashing for tests (production uses 12 via SecurityConfig bean override below? no -
# BCrypt strength lives in SecurityConfig; tests accept cost-12 on a handful of logins).
pokeapi.base-url=http://localhost:9999/api/v2
security.jwt.secret=a8f5f167f44f4964e6c998dee827110c3b2e1f5d7a9b4c6e8f0a2d4b6c8e0f2a
security.jwt.ttl=PT1H

# H2 cannot parse PostgreSQL expression indexes, so the test profile runs only
# the portable core migrations (db/migration); the PG-only optimization folder
# (db/migration-pg) is excluded here but applied automatically in production.
spring.flyway.locations=classpath:db/migration
