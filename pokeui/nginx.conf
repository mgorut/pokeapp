# Nginx server for the PokéManager SPA.
# Two responsibilities:
#  1. Serve the Vite production bundle with HTML5-history fallback.
#  2. Reverse-proxy /api/* to the backend service (docker-compose DNS name),
#     keeping a single same-origin surface for the browser.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Gzip text assets to shrink the initial payload.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets (js/css) are immutable -> long cache life.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy: frontend calls /api/... relative paths; forward to backend:8080.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Actuator health passthrough used by orchestration probes if desired.
    location /actuator/health {
        proxy_pass http://backend:8080;
    }

    # SPA fallback: unknown routes return index.html so React Router can
    # handle deep links like /pokemon/1 on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
