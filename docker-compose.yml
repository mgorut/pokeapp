services:
  postgres:
    image: postgres:15-alpine
    container_name: pokemanager-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432" # exposed for local psql debugging; remove in prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pokemanager-net

  backend:
    build:
      context: ./pokeapi
      dockerfile: Dockerfile
    container_name: pokemanager-api
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      POKEAPI_BASE_URL: ${POKEAPI_BASE_URL}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pokemanager-net
    restart: unless-stopped

  frontend:
    build:
      context: ./pokeui
      dockerfile: Dockerfile
      args:
        VITE_TOKEN_KEY: ${VITE_TOKEN_KEY}
    container_name: pokemanager-ui
    ports:
      - "3000:80" # spec requirement: UI on http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pokemanager-net
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  pokemanager-net:
    driver: bridge
